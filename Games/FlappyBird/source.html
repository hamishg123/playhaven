<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Unity Game</title>
  <link rel="icon" href="icon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #loading-cover {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #000;
      color: #00ffb3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <div id="loading-cover">Loading game...</div>
    <canvas id="unity-canvas"></canvas>
  </div>

  <script>
    // Change this path to your Unity build files
    const buildUrl = "Build/FlappyBird1";
    const loaderUrl = buildUrl + ".loader.js";
    const config = {
      dataUrl: buildUrl + ".data",
      frameworkUrl: buildUrl + ".framework.js",
      codeUrl: buildUrl + ".wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "playhaven studio",
      productName: "FlappyyBird",
      productVersion: "1.0",
    };

    const loadingCover = document.getElementById("loading-cover");

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
        loadingCover.textContent = "Loading... " + Math.round(progress * 100) + "%";
      }).then(() => {
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert("Failed to load Unity: " + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
