<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Slope - topVAZ</title>
    <meta name="robots" content="noindex,nofollow" />
    <link href="shared/style.css" rel="stylesheet" />
    <link rel="stylesheet" href="TemplateData56/style.css" />
    <script src="TemplateData56/UnityProgress.js"></script>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="icon" href="slope4.jpeg" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      .webgl-content, #gameContainer {
        width: 100%;
        height: 100%;
      }

      iframe, canvas {
        display: block;
      }
    </style>

    <script src="Build/UnityLoader.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        const resizeGame = () => {
          const container = document.getElementById("gameContainer");
          container.style.width = container.parentElement.offsetWidth + "px";
          container.style.height = container.parentElement.offsetHeight + "px";
        };

        window.addEventListener("resize", resizeGame);
        resizeGame(); // run on load

        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope_27Sept.json", {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              UnityProgress(gameInstance, "complete");
            },
          },
        });
      });
    </script>
  </head>

  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
    </div>
  </body>
</html>
