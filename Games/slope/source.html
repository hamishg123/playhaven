<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Slope - topVAZ</title>
  <meta name="robots" content="noindex,nofollow" />
  <link href="shared/style.css" rel="stylesheet" />
  <link rel="stylesheet" href="TemplateData56/style.css" />
  <script src="TemplateData56/UnityProgress.js"></script>
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <link rel="icon" href="slope4.jpeg" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Make Unity container perfectly fill iframe */
    #gameContainer {
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="Build/UnityLoader.js"></script>
  <script>
    // Prevent margin and scroll issues
    window.addEventListener("DOMContentLoaded", () => {
      document.body.style.margin = "0";
      document.body.style.height = "100%";
    });

    // Force game to match iframe size on resize
    window.addEventListener("resize", () => {
      const game = document.getElementById("gameContainer");
      if (game) {
        game.style.width = "100%";
        game.style.height = "100%";
      }
    });

    // Custom WebSocket patch (keep your original)
    window.rWS = WebSocket;
    WebSocket = function (url, options) {
      const split = url.split("://");
      let prefix = "";
      if (!url.includes("arc.io")) {
        switch (split[0].toLowerCase()) {
          case "ws":
            prefix = "wss://onebigorange-tmm.tbt.mx/websocket/http://";
            break;
          case "wss":
            prefix = "wss://onebigorange-tmm.tbt.mx/websocket/https://";
            break;
          default:
            prefix = split[0];
        }
        return new (Function.prototype.bind.call(window.rWS, null, (split[1].match(/\//g) || []).length === 0
          ? (split[1].includes("?") ? prefix + split[1].replace("?", "/?") : prefix + split[1] + "/")
          : prefix + split[1], options))();
      } else {
        return new window.rWS(url, options);
      }
    };

    // XMLHttpRequest patch (same as yours)
    const origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (...args) {
      if (!args[1].includes("arc.io"))
        args[1] = /^http/.test(args[1])
          ? "https://onebigstatic-tmm.tbt.mx/static/" + args[1]
          : args[1];
      origOpen.apply(this, args);
    };

    // Instantiate Unity game normally
    let gameInstance;
    window.addEventListener("load", function () {
      gameInstance = UnityLoader.instantiate(
        "gameContainer",
        "Build/slope_27Sept.json",
        {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              UnityProgress(gameInstance, "complete");
            },
          },
        }
      );
    });
  </script>
</head>

<body>
  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>
</body>
</html>
