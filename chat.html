<!DOCTYPE html>
<html>
<head>
<title>Simple Chat</title>
<style>
body{
font-family:Arial;
text-align:center;
background:#111;
color:white;
}

#chatBox{
width:300px;
height:200px;
border:1px solid white;
margin:auto;
overflow-y:auto;
padding:10px;
background:#222;
}

input,button{
margin:5px;
padding:8px;
}
</style>
</head>

<body>

<h2>Simple Chat</h2>

<p>Your Code: <span id="myCode"></span></p>

<input id="friendCode" placeholder="Enter friend code">

<div id="chatBox"></div>

<input id="message" placeholder="Type message">
<button onclick="sendMessage()">Send</button>

<script>

// generate user code
let myCode = localStorage.getItem("myCode");

if(!myCode){
    myCode = Math.floor(100000 + Math.random()*900000);
    localStorage.setItem("myCode", myCode);
}

document.getElementById("myCode").innerText = myCode;


// send message
function sendMessage(){

let friend = document.getElementById("friendCode").value;
let message = document.getElementById("message").value;

if(friend == "" || message == "") return;

let chatKey = "chat_" + myCode + "_" + friend;

let messages = JSON.parse(localStorage.getItem(chatKey)) || [];

messages.push({
sender: myCode,
text: message
});

localStorage.setItem(chatKey, JSON.stringify(messages));

document.getElementById("message").value="";

loadChat();

}


// load chat
function loadChat(){

let friend = document.getElementById("friendCode").value;

if(friend == "") return;

let chatKey = "chat_" + myCode + "_" + friend;

let messages = JSON.parse(localStorage.getItem(chatKey)) || [];

let chatBox = document.getElementById("chatBox");

chatBox.innerHTML="";

messages.forEach(msg=>{
chatBox.innerHTML += "<p><b>"+msg.sender+":</b> "+msg.text+"</p>";
});

}


// refresh chat
setInterval(loadChat,1000);

</script>

</body>
</html>
